<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Whether Forecast">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ccbff"/>
      <stop offset="1" stop-color="#2e9be6"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eefa"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#sky)"/>

  <!--
    One path, so no seam shows between the lobes at small sizes. Arcs are
    absolute A commands: ImageMagick has dropped shorthand path forms before,
    and the PNG icons are rasterised from this file.
  -->
  <path
    fill="url(#cloud)"
    d="M19.5 46.5 A8 8 0 1 1 19.54 30.5 A12 12 0 0 1 43.12 28.51 A9 9 0 1 1 43.5 46.5 Z"
  />
</svg>
