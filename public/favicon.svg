<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Whether Forecast">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eb3f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f5"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#sky)"/>

  <!--
    Sun sits upper-left, the quadrant the cloud leaves clear. Rays are spelt
    out with absolute L commands: some SVG rasterisers drop the shorthand v
    and h forms, which silently cost two of the five. They are kept short and
    thick so they survive a 32px favicon instead of dissolving into specks.
  -->
  <g stroke="#fcd34d" stroke-width="4" stroke-linecap="round">
    <path d="M8.4 24.0 L4.4 24.0"/>
    <path d="M12.4 14.4 L9.6 11.6"/>
    <path d="M22.0 10.4 L22.0 6.4"/>
    <path d="M31.6 14.4 L34.4 11.6"/>
    <path d="M12.4 33.6 L9.6 36.4"/>
  </g>
  <circle cx="22" cy="24" r="10.5" fill="url(#sun)"/>

  <!-- One path, so no seam shows between the lobes at small sizes. -->
  <path
    fill="url(#cloud)"
    d="M24 55a9.8 9.8 0 0 1-1.3-19.5 13.4 13.4 0 0 1 25.2 4.4A8.5 8.5 0 0 1 46.6 55z"
  />
</svg>
